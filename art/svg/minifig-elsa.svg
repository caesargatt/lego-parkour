<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 220" width="140" height="220" role="img" aria-label="艾莎">
  <defs>
    <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9FD8F2"/><stop offset="1" stop-color="#4FA3D9"/>
    </linearGradient>
    <linearGradient id="cape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F7FF" stop-opacity="0.85"/><stop offset="1" stop-color="#BFE6FA" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- sheer cape behind -->
  <path d="M38 84 L102 84 L124 210 L16 210 Z" fill="url(#cape)" stroke="#7FC4E8" stroke-width="2"/>
  <!-- platinum hair back + swept quiff -->
  <rect x="34" y="16" width="72" height="20" fill="#F3E7C4" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M34 22 Q60 4 106 20 L106 30 Q72 18 34 32 Z" fill="#FFF6DC" stroke="#1a1a1a" stroke-width="2"/>
  <!-- cube head, warm fair skin -->
  <rect x="38" y="30" width="56" height="54" fill="#FCE3D2" stroke="#1a1a1a" stroke-width="3"/>
  <!-- eyes w/ lashes, blue iris -->
  <rect x="49" y="48" width="9" height="10" fill="#2E6FA8"/><rect x="48" y="45" width="12" height="3" fill="#1a1a1a"/>
  <rect x="74" y="48" width="9" height="10" fill="#2E6FA8"/><rect x="72" y="45" width="12" height="3" fill="#1a1a1a"/>
  <rect x="58" y="68" width="16" height="4" fill="#C9506B"/>
  <!-- signature side braid over left shoulder -->
  
  <!-- bodice -->
  <rect x="40" y="84" width="52" height="38" fill="#6FC0EA" stroke="#1a1a1a" stroke-width="3"/>
  <!-- arms sleeves -->
  <rect x="22" y="86" width="18" height="42" fill="#BFE6FA" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="92" y="86" width="16" height="42" fill="#BFE6FA" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="21" y="126" width="20" height="14" fill="#FCE3D2" stroke="#1a1a1a" stroke-width="3"/>
  <g fill="#F3E7C4" stroke="#1a1a1a" stroke-width="2">
    <rect x="92" y="58" width="16" height="14"/><rect x="104" y="70" width="14" height="14"/>
    <rect x="110" y="84" width="13" height="14"/><rect x="111" y="98" width="12" height="14"/>
    <rect x="112" y="112" width="10" height="12"/>
  </g>
  <!-- flared gown (no visible legs) -->
  <path d="M40 122 L92 122 L112 206 L20 206 Z" fill="url(#gown)" stroke="#1a1a1a" stroke-width="3"/>
  <!-- snowflake sparkles -->
  <g fill="#FFFFFF"><circle cx="54" cy="100" r="2.5"/><circle cx="78" cy="96" r="2"/><circle cx="66" cy="110" r="2"/>
  <circle cx="50" cy="150" r="2.5"/><circle cx="82" cy="164" r="2.5"/><circle cx="62" cy="186" r="2"/><circle cx="96" cy="190" r="2"/><circle cx="38" cy="182" r="2"/></g>
  <path d="M66 140 l0 14 M59 147 l14 0 M61 142 l10 10 M71 142 l-10 10" stroke="#FFFFFF" stroke-width="2"/>
